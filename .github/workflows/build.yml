name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build mod
        run: ./gradlew test build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: redstone-priority-calculator
          path: build/libs/redstone-priority-calculator-*.jar
